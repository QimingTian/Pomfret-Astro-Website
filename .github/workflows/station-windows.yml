name: Station Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: general-platforms/personal/station
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: general-platforms/personal/station/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: general-platforms/personal/station/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pomfret-station-windows
          path: general-platforms/personal/station/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
