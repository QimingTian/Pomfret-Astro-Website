name: FRAOS Windows Installers

on:
  workflow_dispatch:

jobs:
  control-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: general-platforms/standard/control-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: general-platforms/standard/control-client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: general-platforms/standard/control-client/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Upload Control Client installer
        uses: actions/upload-artifact@v4
        with:
          name: borean-control-windows
          path: general-platforms/standard/control-client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  station:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: general-platforms/standard/station
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: general-platforms/standard/station/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: general-platforms/standard/station/src-tauri

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build NINA plugin bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-nina-plugin.ps1

      - name: Bundle Mozilla CA for agent
        shell: pwsh
        run: |
          py -3 -m pip install --disable-pip-version-check certifi
          py -3 -c "import certifi, shutil; shutil.copy(certifi.where(), 'agent/cacert.pem')"

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Upload Station installer
        uses: actions/upload-artifact@v4
        with:
          name: borean-station-windows
          path: general-platforms/standard/station/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
