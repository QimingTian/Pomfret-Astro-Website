name: FRAOS Release (OTA)

on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: Create GitHub Release with installer assets
        type: boolean
        default: true

jobs:
  control-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: general-platforms/standard/control-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: general-platforms/standard/control-client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: general-platforms/standard/control-client/src-tauri

      - run: npm ci
      - run: npm run tauri build

      - name: Stage for release script
        shell: bash
        run: |
          mkdir -p dist-ci
          cp "src-tauri/target/release/bundle/dmg/"*.dmg "dist-ci/borean-control-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: borean-control-macos
          path: general-platforms/standard/control-client/dist-ci/*.dmg
          if-no-files-found: error

  control-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: general-platforms/standard/control-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: general-platforms/standard/control-client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: general-platforms/standard/control-client/src-tauri

      - run: npm ci
      - run: npm run tauri build

      - name: Stage for release script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-ci | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist-ci/

      - uses: actions/upload-artifact@v4
        with:
          name: borean-control-windows
          path: general-platforms/standard/control-client/dist-ci/*.exe
          if-no-files-found: error

  station-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: general-platforms/standard/station
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: general-platforms/standard/station/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: general-platforms/standard/station/src-tauri

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: npm ci

      - name: Build NINA plugin bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-nina-plugin.ps1

      - run: npm run tauri build

      - name: Stage for release script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-ci | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist-ci/

      - uses: actions/upload-artifact@v4
        with:
          name: borean-station-windows
          path: general-platforms/standard/station/dist-ci/*.exe
          if-no-files-found: error

  publish-manifest:
    needs: [control-mac, control-windows, station-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place Windows Control installer
        run: |
          mkdir -p general-platforms/standard/control-client/dist-ci
          cp artifacts/borean-control-windows/*.exe general-platforms/standard/control-client/dist-ci/

      - name: Place macOS Control installer
        run: |
          VERSION=$(node -p "require('./general-platforms/standard/control-client/package.json').version")
          mkdir -p general-platforms/standard/control-client/dist-ci
          cp artifacts/borean-control-macos/*.dmg \
            "general-platforms/standard/control-client/dist-ci/Borean Astro Control_${VERSION}_aarch64.dmg"

      - name: Place Station installer
        run: |
          mkdir -p general-platforms/standard/station/dist-ci
          cp artifacts/borean-station-windows/*.exe general-platforms/standard/station/dist-ci/

      - name: Update fraos-release.json
        run: node general-platforms/standard/scripts/stage-release-installers.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: fraos-ota-manifest
          path: |
            general-platforms/standard/shared/fraos-release.json
            general-platforms/standard/website/lib/fraos-release.json
            general-platforms/standard/website/public/releases/

      - name: Create GitHub Release
        if: inputs.create_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTROL=$(node -p "require('./general-platforms/standard/control-client/package.json').version")
          STATION=$(node -p "require('./general-platforms/standard/station/package.json').version")
          TAG="fraos-v${CONTROL}-station-v${STATION}"
          gh release create "$TAG" \
            --title "FRAOS Control v${CONTROL} · Station v${STATION}" \
            --notes "OTA release for Borean Astro FRAOS Standard. Deploy website/public/releases to www.boreanastro.com for in-app updates." \
            general-platforms/standard/website/public/releases/* \
            || gh release upload "$TAG" general-platforms/standard/website/public/releases/*
